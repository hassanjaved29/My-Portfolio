<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hassan Javed Abbasi â€” Creative Freelancer</title>

  <!-- Google Fonts matching reference site's Roboto/RobotoSlab equivalent -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
       ROOT / RESET
    â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: #00DEFF #000000;
    }
    html::-webkit-scrollbar { width: 10px; }
    html::-webkit-scrollbar-track { background: #000000; }
    html::-webkit-scrollbar-thumb { background: #00DEFF; border-radius: 8px; }

    :root {
      --cyan:     #00DEFF;
      --cyan-dim: rgba(0,222,255,0.45);
      --cyan-glow:#00EDFF73;
      --white:    #FFFFFF;
      --grey:     #D6D6D6;
      --dark:     #1D1D1D;
      --border:   rgba(255,255,255,0.19);
      --pad:      clamp(5%, 10vw, 20%);
      --font:     'Roboto', sans-serif;
    }

    body {
      background: #000000;
      color: var(--white);
      font-family: var(--font);
      overflow-x: hidden;
      cursor: none;
    }
    @media (max-width: 768px) { body { cursor: auto; } }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    /* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
       CUSTOM CURSOR
    â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
    #cur {
      position: fixed; top: 0; left: 0;
      width: 14px; height: 14px;
      background: var(--cyan);
      border-radius: 50%;
      pointer-events: none; z-index: 99999;
      will-change: transform;
      transform: translate(-50%,-50%);
      mix-blend-mode: screen;
      backdrop-filter: blur(8px);
      box-shadow:
        0 0 20px rgba(0,222,255,.95),
        0 0 80px rgba(0,222,255,.7),
        0 0 200px rgba(0,222,255,.45);
      transition: width .15s, height .15s, background .15s, border .15s, box-shadow .15s, border-radius .15s;
    }
    #cur.hover {
      width: 26px; height: 26px;
      background: rgba(0,222,255,.2);
      border: 1px solid rgba(0,222,255,.7);
      box-shadow: 0 0 30px rgba(0,222,255,.9), 0 0 90px rgba(0,222,255,.4);
    }
    #cur.click { width: 38px; height: 38px; }
    @media (max-width: 768px) { #cur { display: none; } }

    /* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
       GRADIENT TEXT UTILITY
    â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
    .gradient-text {
      background: linear-gradient(30deg, #ABF9FF 30%, #FFFFFF 75%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
    }

    /* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
       BUTTON STYLES
    â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-family: var(--font); font-size: 16px; font-weight: 400;
      color: var(--white);
      background: var(--cyan-glow);
      box-shadow: 0 0 25px -5px var(--cyan);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 12px 20px;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.2s;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      white-space: nowrap;
    }
    .btn:hover {
      background: var(--cyan);
      color: #000000;
      border-color: var(--cyan);
      box-shadow: 0 0 40px -5px var(--cyan);
      transform: scale(1.03);
    }
    .btn-ghost {
      background: rgba(255,255,255,0);
      box-shadow: none;
    }
    .btn-ghost:hover {
      background: var(--white);
      color: #000000;
      border-color: var(--white);
    }

    /* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
       HEADER / NAV â€” DESKTOP
    â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
    .header-desktop {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: none;
    }
    @media (min-width: 768px) { .header-desktop { display: flex; flex-direction: column; } }

    /* Row 1: logo + start-project */
    .hd-top {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 40px;
      animation: fadeInDown .5s .2s both;
    }
    .hd-logo img { width: 40px; height: 40px; object-fit: contain; }
    .hd-logo { display: flex; align-items: center; }

    /* Row 2: nav pill */
    .hd-nav {
      display: flex; justify-content: center; align-items: center;
      padding: 0 40px 12px;
      animation: fadeInDown .5s .2s both;
    }
    .hd-nav-inner {
      display: flex; gap: 0; align-items: center;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 6px 10px;
      backdrop-filter: blur(10px);
    }
    .hd-nav-inner a {
      font-size: 14px; font-weight: 400;
      color: var(--white); padding: 8px 16px;
      border-radius: 100px;
      transition: background 0.25s, color 0.25s;
      position: relative;
    }
    .hd-nav-inner a:hover,
    .hd-nav-inner a.active {
      background: rgba(255,255,255,0.08);
      color: var(--cyan);
    }

    /* Row 3: socials (right-fixed) */
    .hd-socials {
      position: fixed; right: 40px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 10px; z-index: 201;
      animation: fadeIn .5s .2s both;
    }
    @media (max-width: 767px) { .hd-socials { display: none; } }
    .hd-socials a {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 100px;
      transition: background 0.25s, color 0.25s;
      backdrop-filter: blur(10px);
    }
    .hd-socials a:hover { background: var(--white); color: #000; }
    .hd-socials a svg { width: 18px; height: 18px; fill: currentColor; }

    /* Scroll-to-top (fixed bottom-right) */
    .scroll-top {
      position: fixed; bottom: 40px; right: 100px;
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: var(--cyan-glow);
      border: 1px solid var(--border);
      border-radius: 100px;
      z-index: 201;
      transition: background 0.25s, transform 0.25s;
      backdrop-filter: blur(10px);
      animation: fadeInUp .5s .2s both;
    }
    .scroll-top:hover { background: var(--cyan); transform: translateY(-3px); }
    .scroll-top svg { width: 18px; height: 18px; fill: var(--white); }

    /* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
       MOBILE HEADER
    â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
    .header-mobile {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 5%;
      background: rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      border-radius: 100px;
      margin: 14px 5%;
      backdrop-filter: blur(10px);
      animation: fadeInDown .5s .2s both;
    }
    @media (min-width: 768px) { .header-mobile { display: none; } }
    .hm-logo img { width: 32px; height: 32px; }
    .hm-menu-btn {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 100px;
      cursor: pointer;
    }
    .hm-menu-btn img { width: 28px; height: 28px; filter: invert(1); }

    /* MOBILE POPUP MENU */
    .mob-menu {
      position: fixed; inset: 0; z-index: 300;
      background: #000000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 28px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    .mob-menu.open { opacity: 1; pointer-events: all; }
    /* mobile header inside popup */
    .mob-menu-header {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 5%;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 100px;
      margin: 14px 5%;
      backdrop-filter: blur(10px);
    }
    .mob-menu-header img { width: 32px; height: 32px; }
    .mob-menu-close {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 100px;
      cursor: pointer;
    }
    .mob-menu-close img { width: 28px; height: 28px; filter: invert(1); }
    .mob-menu a {
      font-family: var(--font); font-size: 16px;
      color: var(--white);
      background: rgba(255,255,255,0);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 12px 24px;
      min-width: 160px; text-align: center;
      transition: background 0.25s, color 0.25s;
      backdrop-filter: blur(10px);
    }
    .mob-menu a:hover { background: var(--white); color: #000; }
    .mob-socials {
      display: flex; gap: 10px; margin-top: 20px;
    }
    .mob-socials a {
      min-width: 0;
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 0;
    }
    .mob-socials a svg { width: 18px; height: 18px; fill: var(--white); }
    /* marquee in popup */
    .mob-marquee-wrap {
      width: 100%; overflow: hidden;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 10px 0;
      position: absolute; bottom: 80px;
    }
    .mob-marquee {
      display: flex; gap: 40px;
      animation: marqueeScroll 16s linear infinite;
      white-space: nowrap;
      font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--grey);
    }
    .mob-marquee a { color: var(--grey); }
    .mob-marquee li { list-style: none; }

    /* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
       HERO SECTION
    â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
    .hero {
      position: relative; overflow: hidden;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      background: #000000;
      padding: 0 var(--pad);
      padding-top: 120px; padding-bottom: 0;
    }
    /* decorative animated video orbs */
    .hero-vid-bl, .hero-vid-tr {
      position: absolute;
      pointer-events: none; z-index: 0;
      opacity: 0.6;
    }
    .hero-vid-bl {
      width: 700px; height: 700px;
      bottom: -200px; left: -200px;
      transform: scaleX(-1) rotate(30deg);
    }
    .hero-vid-tr {
      width: 700px; height: 700px;
      top: -200px; right: -200px;
      transform: scaleX(-1) rotate(210deg);
    }
    @media (max-width: 1024px) {
      .hero-vid-bl { width: 500px; height: 500px; }
      .hero-vid-tr { width: 500px; height: 500px; }
    }
    @media (max-width: 767px) {
      .hero-vid-bl { width: 350px; height: 350px; bottom: -150px; left: -150px; }
      .hero-vid-tr { width: 350px; height: 350px; top: -150px; right: -150px; }
    }
    /* gradient fade bottom */
    .hero::after {
      content: ''; position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 200px;
      background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, #000000 100%);
      pointer-events: none; z-index: 1;
    }
    .hero-content {
      position: relative; z-index: 2;
      max-width: 500px;
      text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
    }
    /* animated rotating tagline */
    .hero-tagline {
      font-size: 20px; font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--white);
      display: flex; align-items: center; gap: 8px;
      animation: fadeIn 0.8s 0.2s both;
      min-height: 30px;
    }
    .hero-tagline-static { color: var(--white); }
    .hero-tagline-rotate {
      display: inline-block;
      overflow: hidden; height: 1.2em;
      position: relative;
    }
    .hero-tagline-rotate span {
      display: block;
      color: #C5F8FF;
      animation: rotateText 7.5s step-start infinite;
    }
    @keyframes rotateText {
      0%   { transform: translateY(0); }
      33%  { transform: translateY(-100%); }
      66%  { transform: translateY(-200%); }
      99%  { transform: translateY(-200%); }
      100% { transform: translateY(0); }
    }
    /* big name */
    .hero-name {
      font-size: clamp(50px, 10vw, 100px);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(30deg, #FFFFFF 30%, #ABF9FF 75%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeIn 0.8s 0.1s both;
    }
    .hero-desc {
      font-size: 16px; font-weight: 400;
      color: var(--white);
      line-height: 1.65;
      text-align: center;
      animation: fadeIn 0.8s 0.2s both;
    }
    .hero-cta {
      animation: fadeIn 0.8s 0.4s both;
    }
    /* scroll indicator */
    .hero-scroll-hint {
      position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%);
      z-index: 2;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
      color: rgba(255,255,255,0.25);
    }
    .hero-scroll-hint::after {
      content: '';
      width: 1px; height: 40px;
      background: linear-gradient(to bottom, rgba(0,222,255,0.4), transparent);
      display: block;
    }

    /* spacer after hero */
    .hero-spacer { height: 55px; }

    /* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
       SECTIONS COMMON
    â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
    .section-header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 16px;
      margin-bottom: 40px;
    }
    .section-title {
      font-size: clamp(22px, 3vw, 28px);
      font-weight: 800;
      background: linear-gradient(30deg, #ABF9FF 30%, #FFFFFF 75%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .section-pad {
      padding: clamp(60px,8vw,100px) var(--pad);
      background: #000;
    }

    /* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
       FEATURED PROJECTS GRID (2-col like reference)
    â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin: 40px 0 140px;
    }
    @media (max-width: 1024px) {
      .projects-grid { grid-template-columns: 1fr; gap: 40px; }
    }
    @media (max-width: 767px) {
      .projects-grid { margin-bottom: 80px; }
    }
    .project-card {
      display: block;
      background: transparent;
      border-radius: 25px;
      overflow: hidden;
      transition: transform 0.3s;
      cursor: pointer;
    }
    .project-card:hover { transform: translateY(-8px); }
    .project-card-img {
      width: 100%; aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 25px;
      border: 1px solid var(--border);
    }
    /* placeholder gradient images */
    .project-img-placeholder {
      width: 100%; aspect-ratio: 16/9;
